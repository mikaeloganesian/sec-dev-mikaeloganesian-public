name: Security - DAST (P11, ZAP baseline)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "src/**"
      - ".github/workflows/ci-p11-dast.yml"
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - ".github/workflows/ci-p11-dast.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast_p11:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run app
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'
          sleep 2
          curl -f http://localhost:8000/health || exit 1

      - name: ZAP Baseline
        run: |
          mkdir -p EVIDENCE/P11
          pwd
          ls -la
          docker run --rm --network host -v $PWD:/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8000 \
              -r /zap/wrk/zap_baseline.html \
              -J /zap/wrk/zap_baseline.json \
              -d \
              -I \
              --autooff || true
          echo "=== Checking for report files ==="
          echo "Current directory: $(pwd)"
          echo "Files in current dir:"
          ls -la
          echo "Files matching *baseline*:"
          find . -name "*baseline*" -type f 2>/dev/null || echo "No baseline files found"
          echo "All .html files:"
          find . -name "*.html" -type f 2>/dev/null | head -5 || echo "No html files found"
          echo "All .json files:"
          find . -name "*.json" -type f 2>/dev/null | head -5 || echo "No json files found"
          if [ -f zap_baseline.html ]; then
            mv zap_baseline.html EVIDENCE/P11/
            echo "✓ HTML report moved to EVIDENCE/P11/"
          elif [ -f /zap/wrk/zap_baseline.html ]; then
            cp /zap/wrk/zap_baseline.html EVIDENCE/P11/
            echo "✓ HTML report copied from /zap/wrk/"
          else
            echo "✗ Warning: zap_baseline.html not found"
          fi
          if [ -f zap_baseline.json ]; then
            mv zap_baseline.json EVIDENCE/P11/
            echo "✓ JSON report moved to EVIDENCE/P11/"
          elif [ -f /zap/wrk/zap_baseline.json ]; then
            cp /zap/wrk/zap_baseline.json EVIDENCE/P11/
            echo "✓ JSON report copied from /zap/wrk/"
          else
            echo "✗ Warning: zap_baseline.json not found"
          fi
          echo "=== Final check: Files in EVIDENCE/P11/ ==="
          ls -la EVIDENCE/P11/ || echo "Directory is empty"
          if [ ! -f EVIDENCE/P11/zap_baseline.html ] && [ ! -f EVIDENCE/P11/zap_baseline.json ]; then
            echo "ERROR: No reports generated! Creating placeholder files..."
            echo "ZAP scan completed but reports were not generated. Check ZAP logs above." > EVIDENCE/P11/ERROR.txt
          fi

      - name: Upload P11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
          retention-days: 7
