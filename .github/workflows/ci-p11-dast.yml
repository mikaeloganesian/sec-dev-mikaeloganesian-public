name: Security - DAST (P11, ZAP baseline)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "src/**"
      - ".github/workflows/ci-p11-dast.yml"
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - ".github/workflows/ci-p11-dast.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast_p11:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run app
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'
          sleep 2
          curl -f http://localhost:8000/health || exit 1

      - name: ZAP Baseline
        run: |
          mkdir -p EVIDENCE/P11
          chmod 777 $PWD EVIDENCE/P11 || true
          ZAP_PORT=8080
          docker run -d --name zap --network host \
            -v $PWD:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap.sh -daemon -host 0.0.0.0 -port $ZAP_PORT
          echo "Waiting for ZAP to start..."
          for i in {1..30}; do
            if curl -s http://localhost:$ZAP_PORT/JSON/core/view/version/ > /dev/null 2>&1; then
              echo "ZAP is ready"
              break
            fi
            sleep 1
          done
          echo "Spidering target..."
          curl -s "http://localhost:$ZAP_PORT/JSON/spider/action/scan/?url=http://localhost:8000" > /dev/null
          sleep 10
          echo "Waiting for passive scan..."
          sleep 10
          echo "Generating HTML report..."
          curl -s "http://localhost:$ZAP_PORT/OTHER/core/other/htmlreport/" > zap_baseline.html || echo "Failed to get HTML report"
          echo "Generating JSON report..."
          curl -s "http://localhost:$ZAP_PORT/JSON/core/view/alerts/?baseurl=http://localhost:8000" > zap_baseline.json || echo "Failed to get JSON report"
          docker stop zap || true
          docker rm zap || true
          if [ -f zap_baseline.html ] && [ -s zap_baseline.html ]; then
            mv zap_baseline.html EVIDENCE/P11/
            echo "✓ HTML report created"
          else
            echo "✗ Warning: zap_baseline.html not found or empty"
          fi
          if [ -f zap_baseline.json ] && [ -s zap_baseline.json ]; then
            mv zap_baseline.json EVIDENCE/P11/
            echo "✓ JSON report created"
          else
            echo "✗ Warning: zap_baseline.json not found or empty"
          fi
          ls -la EVIDENCE/P11/

      - name: Upload P11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
          retention-days: 7
