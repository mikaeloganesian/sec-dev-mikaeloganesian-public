name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/ci-sast-secrets.yml"
      - "security/**"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/ci-sast-secrets.yml"
      - "security/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-and-secrets:
    name: SAST & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p EVIDENCE/P10

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            returntocorp/semgrep:latest \
            semgrep ci \
              --config p/ci \
              --config /src/security/semgrep/rules.yml \
              --sarif \
              --output /src/EVIDENCE/P10/semgrep.sarif \
              --metrics=off \
              --no-git-ignore \
              || true
        continue-on-error: true

      - name: Run Gitleaks secrets scan
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            zricethezav/gitleaks:latest \
            detect \
              --no-banner \
              --config=/repo/security/.gitleaks.toml \
              --source=/repo \
              --report-format=json \
              --report-path=/repo/EVIDENCE/P10/gitleaks.json \
              --verbose \
              || true
        continue-on-error: true

      - name: Generate SAST summary
        run: |
          echo "# SAST Summary" > EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          
          if [ -f EVIDENCE/P10/semgrep.sarif ]; then
            echo "## Semgrep Results" >> EVIDENCE/P10/sast_summary.md
            echo "" >> EVIDENCE/P10/sast_summary.md
            
            if command -v jq &> /dev/null; then
              ERROR_COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
              WARNING_COUNT=$(jq '[.runs[].results[] | select(.level == "warning")] | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
              INFO_COUNT=$(jq '[.runs[].results[] | select(.level == "note")] | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
              
              echo "- **Errors**: $ERROR_COUNT" >> EVIDENCE/P10/sast_summary.md
              echo "- **Warnings**: $WARNING_COUNT" >> EVIDENCE/P10/sast_summary.md
              echo "- **Info**: $INFO_COUNT" >> EVIDENCE/P10/sast_summary.md
            else
              echo "SARIF file generated. Use a SARIF viewer to analyze results." >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo "Semgrep SARIF file not found." >> EVIDENCE/P10/sast_summary.md
          fi
          
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Gitleaks Results" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          
          if [ -f EVIDENCE/P10/gitleaks.json ]; then
            if command -v jq &> /dev/null; then
              SECRET_COUNT=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
              echo "- **Secrets found**: $SECRET_COUNT" >> EVIDENCE/P10/sast_summary.md
              
              if [ "$SECRET_COUNT" -gt 0 ]; then
                echo "" >> EVIDENCE/P10/sast_summary.md
                echo "### Detected Secrets:" >> EVIDENCE/P10/sast_summary.md
                jq -r '.[] | "- \(.RuleID) in \(.File):\(.StartLine)"' EVIDENCE/P10/gitleaks.json >> EVIDENCE/P10/sast_summary.md 2>/dev/null || true
              else
                echo "No secrets detected." >> EVIDENCE/P10/sast_summary.md
              fi
            else
              echo "JSON file generated. Review manually." >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo "Gitleaks JSON file not found." >> EVIDENCE/P10/sast_summary.md
          fi
        continue-on-error: true

      - name: Upload SAST & Secrets artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10-sast-secrets
          path: EVIDENCE/P10/
          retention-days: 7

