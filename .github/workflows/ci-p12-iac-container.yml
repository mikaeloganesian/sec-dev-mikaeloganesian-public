name: Security - IaC & Container (P12)

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - "iac/**"
      - "k8s/**"
      - "deploy/**"
      - "compose.yaml"
      - ".github/workflows/ci-p12-iac-container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "iac/**"
      - "k8s/**"
      - "deploy/**"
      - "compose.yaml"
      - ".github/workflows/ci-p12-iac-container.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac_container_security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P12

      - name: Build container image
        run: |
          docker build -t sec-dev-app:local -f Dockerfile .

      - name: Run Hadolint on Dockerfile
        run: |
          docker run --rm -i \
            -v $PWD:/work \
            hadolint/hadolint \
            hadolint -f json /work/Dockerfile > EVIDENCE/P12/hadolint_report.json || true
          echo "Hadolint report generated"

      - name: Run Checkov on IaC
        run: |
          # Check for IaC files in different locations
          IAC_DIRS=""
          if [ -d "iac" ]; then
            echo "Found iac/ directory"
            IAC_DIRS="$IAC_DIRS -d /work/iac"
          fi
          if [ -d "k8s" ]; then
            echo "Found k8s/ directory"
            IAC_DIRS="$IAC_DIRS -d /work/k8s"
          fi
          if [ -d "deploy" ]; then
            echo "Found deploy/ directory"
            IAC_DIRS="$IAC_DIRS -d /work/deploy"
          fi
          if [ -f "compose.yaml" ] || [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            echo "Found docker-compose file"
            IAC_DIRS="$IAC_DIRS -d /work"
          fi
          
          if [ -n "$IAC_DIRS" ]; then
            echo "Running Checkov with directories: $IAC_DIRS"
            CHECKOV_CONFIG=""
            if [ -f security/checkov.yaml ]; then
              CHECKOV_CONFIG="--config-file /work/security/checkov.yaml"
              echo "Using Checkov config from security/checkov.yaml"
            else
              echo "No Checkov config file found, using defaults"
            fi
            # Run Checkov, redirect stderr to separate file, stdout to report
            # Use --no-fail-on-crash to ensure we get output even on errors
            docker run --rm \
              -v $PWD:/work \
              bridgecrew/checkov \
              $IAC_DIRS \
              -o json \
              --compact \
              --no-fail-on-crash \
              $CHECKOV_CONFIG > EVIDENCE/P12/checkov_report.json 2>EVIDENCE/P12/checkov_errors.log || true
            
            # Show errors if any
            if [ -s EVIDENCE/P12/checkov_errors.log ]; then
              echo "Checkov stderr output:"
              cat EVIDENCE/P12/checkov_errors.log
            fi
            
            # Check if report is empty or invalid JSON
            if [ ! -s EVIDENCE/P12/checkov_report.json ]; then
              echo "Warning: Checkov report is empty, creating minimal report"
              echo '{"summary": {"failed": 0, "passed": 0, "skipped": 0, "parsing_errors": 0}, "results": {"failed_checks": [], "passed_checks": []}}' > EVIDENCE/P12/checkov_report.json
            elif ! jq empty EVIDENCE/P12/checkov_report.json 2>/dev/null; then
              echo "Warning: Checkov report is not valid JSON"
              # Check if it's just an error message
              if grep -q "error\|Error\|ERROR" EVIDENCE/P12/checkov_report.json 2>/dev/null; then
                echo "Report contains error message, creating minimal report"
                echo '{"summary": {"failed": 0, "passed": 0, "skipped": 0, "parsing_errors": 0}, "results": {"failed_checks": [], "passed_checks": []}}' > EVIDENCE/P12/checkov_report.json
              fi
            else
              echo "Checkov report is valid JSON"
            fi
            echo "Checkov report generated"
            echo "Report size: $(wc -c < EVIDENCE/P12/checkov_report.json) bytes"
          else
            echo '{"summary": {"failed": 0, "passed": 0, "skipped": 0, "parsing_errors": 0}, "results": {"failed_checks": [], "passed_checks": []}}' > EVIDENCE/P12/checkov_report.json
            echo "No IaC files found, created empty report"
          fi

      - name: Run Trivy on container image
        run: |
          # Verify image exists
          if ! docker image inspect sec-dev-app:local >/dev/null 2>&1; then
            echo "Error: Image sec-dev-app:local not found"
            exit 1
          fi
          
          echo "Running Trivy scan on sec-dev-app:local"
          docker run --rm \
            -v $PWD:/work \
            aquasec/trivy:latest \
            image --scanners vuln,config --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json --output /work/EVIDENCE/P12/trivy_report.json sec-dev-app:local 2>&1 || true
          
          # Check if report was generated
          if [ -f EVIDENCE/P12/trivy_report.json ] && [ -s EVIDENCE/P12/trivy_report.json ]; then
            if jq empty EVIDENCE/P12/trivy_report.json 2>/dev/null; then
              echo "Trivy report generated successfully (valid JSON)"
              echo "Report size: $(wc -c < EVIDENCE/P12/trivy_report.json) bytes"
            else
              echo "Warning: Trivy report is not valid JSON"
            fi
          else
            echo "Warning: Trivy report is empty or missing, creating minimal report"
            echo '{"SchemaVersion": 2, "ArtifactName": "sec-dev-app:local", "ArtifactType": "container_image", "Results": []}' > EVIDENCE/P12/trivy_report.json
          fi

      - name: Display report summaries
        run: |
          echo "=== Hadolint Summary ==="
          if [ -f EVIDENCE/P12/hadolint_report.json ]; then
            cat EVIDENCE/P12/hadolint_report.json | jq -r '.[] | "\(.code): \(.message)"' 2>/dev/null || echo "Report exists but may be empty or invalid"
          else
            echo "No Hadolint report found"
          fi
          
          echo ""
          echo "=== Checkov Summary ==="
          if [ -f EVIDENCE/P12/checkov_report.json ]; then
            cat EVIDENCE/P12/checkov_report.json | jq -r '.summary' 2>/dev/null || echo "Report exists but may be empty or invalid"
          else
            echo "No Checkov report found"
          fi
          
          echo ""
          echo "=== Trivy Summary ==="
          if [ -f EVIDENCE/P12/trivy_report.json ]; then
            cat EVIDENCE/P12/trivy_report.json | jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity): \(.VulnerabilityID) - \(.PkgName)"' 2>/dev/null | head -20 || echo "Report exists but may be empty or invalid"
          else
            echo "No Trivy report found"
          fi

      - name: Upload P12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P12_EVIDENCE
          path: EVIDENCE/P12
          retention-days: 7
