name: Security - IaC & Container (P12)

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - "iac/**"
      - "k8s/**"
      - "deploy/**"
      - "compose.yaml"
      - ".github/workflows/ci-p12-iac-container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "iac/**"
      - "k8s/**"
      - "deploy/**"
      - "compose.yaml"
      - ".github/workflows/ci-p12-iac-container.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac_container_security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P12

      - name: Build container image
        run: |
          docker build -t sec-dev-app:local -f Dockerfile .

      - name: Run Hadolint on Dockerfile
        run: |
          docker run --rm -i \
            -v $PWD:/work \
            hadolint/hadolint \
            hadolint -f json /work/Dockerfile > EVIDENCE/P12/hadolint_report.json || true
          echo "Hadolint report generated"

      - name: Run Checkov on IaC
        run: |
          # Check for IaC files in different locations
          IAC_DIRS=""
          if [ -d "iac" ]; then
            IAC_DIRS="$IAC_DIRS -d /work/iac"
          fi
          if [ -d "k8s" ]; then
            IAC_DIRS="$IAC_DIRS -d /work/k8s"
          fi
          if [ -d "deploy" ]; then
            IAC_DIRS="$IAC_DIRS -d /work/deploy"
          fi
          if [ -f "compose.yaml" ] || [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            IAC_DIRS="$IAC_DIRS -d /work"
          fi
          
          if [ -n "$IAC_DIRS" ]; then
            CHECKOV_CONFIG=""
            if [ -f security/checkov.yaml ]; then
              CHECKOV_CONFIG="--config-file /work/security/checkov.yaml"
            fi
            docker run --rm \
              -v $PWD:/work \
              bridgecrew/checkov \
              $IAC_DIRS \
              -o json \
              --compact \
              $CHECKOV_CONFIG > EVIDENCE/P12/checkov_report.json || true
            echo "Checkov report generated"
          else
            echo '{"summary": {"failed": 0, "passed": 0, "skipped": 0, "parsing_errors": 0}, "results": {"failed_checks": [], "passed_checks": []}}' > EVIDENCE/P12/checkov_report.json
            echo "No IaC files found, created empty report"
          fi

      - name: Run Trivy on container image
        run: |
          docker run --rm \
            -v $PWD:/work \
            aquasec/trivy:latest \
            image --scanners vuln,config --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format json --output /work/EVIDENCE/P12/trivy_report.json sec-dev-app:local || true
          echo "Trivy report generated"

      - name: Display report summaries
        run: |
          echo "=== Hadolint Summary ==="
          if [ -f EVIDENCE/P12/hadolint_report.json ]; then
            cat EVIDENCE/P12/hadolint_report.json | jq -r '.[] | "\(.code): \(.message)"' 2>/dev/null || echo "Report exists but may be empty or invalid"
          else
            echo "No Hadolint report found"
          fi
          
          echo ""
          echo "=== Checkov Summary ==="
          if [ -f EVIDENCE/P12/checkov_report.json ]; then
            cat EVIDENCE/P12/checkov_report.json | jq -r '.summary' 2>/dev/null || echo "Report exists but may be empty or invalid"
          else
            echo "No Checkov report found"
          fi
          
          echo ""
          echo "=== Trivy Summary ==="
          if [ -f EVIDENCE/P12/trivy_report.json ]; then
            cat EVIDENCE/P12/trivy_report.json | jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity): \(.VulnerabilityID) - \(.PkgName)"' 2>/dev/null | head -20 || echo "Report exists but may be empty or invalid"
          else
            echo "No Trivy report found"
          fi

      - name: Upload P12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P12_EVIDENCE
          path: EVIDENCE/P12
          retention-days: 7
