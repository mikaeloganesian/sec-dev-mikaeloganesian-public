title = "Gitleaks configuration for P10"

[allowlist]
  description = "Allowlist для исключения известных безопасных паттернов"
  
  # Исключаем директории с тестовыми данными и документацией
  paths = [
    '''tests/.*''',      # Тестовые файлы могут содержать синтетические секреты
    '''docs/.*''',       # Документация с примерами использования
    '''EVIDENCE/.*''',   # Отчёты сканирования
    '''\.git/.*''',      # Git метаданные
    '''venv/.*''',       # Виртуальное окружение Python
    '''__pycache__/.*''', # Кэш Python
    '''\.pytest_cache/.*''', # Кэш pytest
  ]
  
  # Исключаем паттерны, которые являются примерами, а не реальными секретами
  regexes = [
    '''(?i)example.*password''',  # Примеры паролей в документации
    '''(?i)example.*key''',       # Примеры ключей в документации
    '''(?i)example.*secret''',    # Примеры секретов в документации
    '''(?i)dummy.*token''',       # Тестовые токены
    '''(?i)test.*api.*key''',     # Тестовые API ключи
    '''DB_PASSWORD.*example''',   # Примеры переменных окружения
    '''DATABASE_URL.*sqlite''',   # SQLite URLs не содержат реальных секретов
  ]
  
  # Исключаем коммиты с тестовыми данными
  commits = [
    '''.*example.*password.*''',  # Коммиты с примерами паролей
    '''.*test.*secret.*''',       # Коммиты с тестовыми секретами
  ]
